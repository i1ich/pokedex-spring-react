spring:
  application:
    name: tasks
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USERNAME:tasks}
    password: ${DB_PASSWORD:tasks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # an enum is sent by name only; ordinals (status: 1) would tie the API to declaration order
      fail-on-numbers-for-enums: true

app:
  # zone that decides what "today" means for the due-date rule; override with APP_TIME_ZONE
  time-zone: ${APP_TIME_ZONE:UTC}

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
