# Docker DNS; the backend is looked up at request time (not once at start), so a recreated
# backend container is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API: same-origin for the browser, so no CORS is involved in Docker.
    # The backend sets its own security headers on API responses.
    # Swagger UI and the actuator are intentionally not exposed here (use http://localhost:8080 directly).
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite emits content-hashed file names under /assets: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else is the single-page app: unknown paths (deep links such as /pokemon/pikachu)
    # fall back to index.html, which must never be cached so a new deploy is picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
